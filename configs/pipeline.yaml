project:
  study_start_date: "2018-01-01"
  filter_end_date: "2023-12-31"
  archive_start_date: "2024-01-01"
  end_date: "2026-03-31"
  intervention_start_date: "2025-01-01"
  timezone: "Europe/Sofia"

sources:
  sofia_boundary_url: "https://api.sofiaplan.bg/datasets/79"
  sensor_community_archive: "https://archive.sensor.community"
  sensor_type: "sds011"

paths:
  # Download the FILTER BGR directory and Sensor_Location.csv separately, then set
  # these two paths (or copy them to these defaults).
  sensor_locations: "data/raw/filter/Sensor_Location.csv"
  bgr_directory: "data/raw/filter/BGR"
  boundary: "data/raw/boundaries/sofia_municipality.geojson"
  manifest: "data/interim/sensors/sofia_sensor_manifest.csv"
  archive: "data/raw/sensor_community"
  filter_hourly: "data/interim/sensors/filter_hourly_qc.csv"
  archive_hourly: "data/interim/sensors/archive_hourly_qc.csv"
  hourly: "data/interim/sensors/pm25_hourly_unified.csv"
  completeness_year: "data/interim/diagnostics/completeness_sensor_year.csv"
  completeness_season: "data/interim/diagnostics/completeness_sensor_season.csv"
  panel: "data/interim/diagnostics/stable_panel.csv"
  daily: "data/processed/daily_pm25.csv"

  # Reserved for the next project stages. They are not populated by the
  # sensor workflow yet.
  meteorology: "data/raw/meteorology"
  background: "data/raw/background"
  policy: "data/raw/policy"
  predictors: "data/interim/predictors/daily_predictors.csv"
  model_table: "data/processed/model_table.csv"
  model_file: "models/random_forest.joblib"
  predictions: "data/processed/counterfactual_predictions.csv"
  figures: "outputs/figures"
  tables: "outputs/tables"

manifest:
  # A historical pair is a plausible 2024+ continuation if it was still seen
  # during the final quarter of the FILTER record. This is a download prefilter,
  # not the final analytical panel decision.
  continuing_after: "2023-10-01"
  historical_qc_prefix: "1233"
  require_spread: 3

download:
  workers: 8
  retries: 2
  timeout_seconds: 45

qc:
  pm25_min: 0.0
  pm25_max: 1000.0
  minimum_twenty_minute_bins: 3
  temporal_window_hours: 360
  temporal_min_periods: 72
  temporal_mad_multiplier: 8.0
  temporal_absolute_floor: 75.0

aggregation:
  minimum_valid_hours_per_day: 18
  # Project-specific analytical safeguard applied to daily means. The upper
  # boundary is exclusive: values equal to or above 250 ug/m3 are flagged.
  maximum_daily_pm25_exclusive: 250.0

panel_selection:
  # Daily validity is taken from the Stage 3 daily output, including its
  # minimum-hours and <250 ug/m3 requirements.
  # Deliberately relaxed project threshold for the voluntary sensor network.
  minimum_day_fraction: 0.60
  # Pre-LEZ completeness is pooled across these complete calendar years.
  pre_start_year: 2018
  pre_end_year: 2024
  # Each post-LEZ evaluation window must independently meet the threshold.
  post_periods:
    post_2025_jan_mar: ["2025-01-01", "2025-03-31"]
    post_2025_oct_mar: ["2025-10-01", "2026-03-31"]
