# Random Forest model specification for the seminar analysis.
target: pm2_5

training:
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  # Only observations from the Sofia heating-season months enter model fitting
  # and validation.
  include_months: [1, 2, 3, 10, 11, 12]

counterfactual_periods:
  - name: "post_2025_jan_mar"
    start_date: "2025-01-01"
    end_date: "2025-03-31"
  - name: "post_2025_oct_mar"
    start_date: "2025-10-01"
    end_date: "2026-03-31"

random_forest:
  random_state: 42
  final_n_jobs: -1
  search:
    # The grid is small enough to evaluate every configured combination.
    n_jobs: -1
    verbose: 2
    parameter_grid:
      model__n_estimators: [100, 200]
      model__max_depth: [5, 10, null]
      model__max_features: ["sqrt", 0.5, 1.0]
      model__min_samples_leaf: [1, 3, 5]

# Optional comparison model. It uses the same response, predictors and temporal
# folds as the Random Forest, but is not part of the final pipeline by default.
gradient_boosting:
  random_state: 42
  search:
    n_jobs: -1
    verbose: 2
    parameter_grid:
      model__learning_rate: [0.05, 0.1]
      model__max_iter: [100, 200]
      model__max_leaf_nodes: [15, 31]
      model__min_samples_leaf: [20]
      model__l2_regularization: [0.0, 1.0]

validation:
  scoring: "neg_mean_absolute_error"
  benchmark: "sensor_mean"
  # Each validation block is later in time than its expanding training block.
  # The April-September gap keeps complete heating seasons together.
  folds:
    - name: "heating_2021_2022"
      train_end: "2021-03-31"
      validation_start: "2021-10-01"
      validation_end: "2022-03-31"
    - name: "heating_2022_2023"
      train_end: "2022-03-31"
      validation_start: "2022-10-01"
      validation_end: "2023-03-31"
    - name: "heating_2023_2024"
      train_end: "2023-03-31"
      validation_start: "2023-10-01"
      validation_end: "2024-03-31"
  # This recent three-month period is assessed only after a candidate is explicitly selected.
  # It therefore does not receive the same tuning weight as a full heating season.
  test_period:
    name: "autumn_2024"
    train_end: "2024-03-31"
    test_start: "2024-10-01"
    test_end: "2024-12-31"

predictors:
  - temperature_mean_c
  - relative_humidity_mean_pct
  - wind_speed_mean_ms
  - u_wind_mean_ms
  - v_wind_mean_ms
  - surface_pressure_mean_hpa
  - precipitation_sum_mm
  - boundary_layer_height_mean_m
  - day_of_year_sin
  - day_of_year_cos
  - weekday
  - lat
  - lon
