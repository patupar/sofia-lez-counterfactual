[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sofia-lez-counterfactual"
version = "0.1.0"
description = "Reproducible Sensor.Community PM2.5 panel preparation for Sofia's residential-heating LEZ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
sofia-lez = "sofia_lez.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
